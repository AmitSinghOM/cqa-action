name: "Code Quality Analyzer gate"
description: >-
  Deterministic, offline code-quality gate (cqa-analyzer) for eight languages.
  Fails the job on new findings, emits SARIF for code scanning, and writes a
  job summary. Never sends source code anywhere.
author: "Amit Singh"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directory to analyze."
    default: "."
  version:
    description: >-
      cqa-analyzer version to install (exact). The action's major tag tracks a
      known-good default; override to pin your own.
    default: "3.5.0"
  deep:
    description: "Install the [deep] extra (tree-sitter duplication and complexity for Go, C/C++, Rust)."
    default: "false"
  fail-on:
    description: "Fail when any selected finding reaches this severity: warning, error, or empty to disable."
    default: "warning"
  fail-under:
    description: "Fail when the architecture signal score is below this value (1.0-10.0). Empty to disable."
    default: ""
  strict:
    description: "Fail on any coverage gap (unparsed files, truncated discovery, invalid manifests)."
    default: "true"
  baseline:
    description: "Path to a privacy-safe baseline written with --write-baseline. Empty to disable."
    default: ""
  new-findings-only:
    description: "With a baseline: only findings absent from it count."
    default: "true"
  changed-lines:
    description: >-
      Restrict gating to lines changed in this pull request. "auto" generates a
      manifest from git diff against the PR base on pull_request events and
      does nothing on other events; a file path uses that manifest; "false"
      disables. The diff ends at the checked-out commit (GitHub's merge commit
      by default) and paths are relative to `path`. Checking out the PR head
      instead needs history (actions/checkout fetch-depth: 0); without it the
      step fails rather than gating the wrong lines.
    default: "auto"
  include-deletions:
    description: >-
      With changed-lines auto: also count a deleted-only hunk as touching the
      line that now follows it, so a finding there is gated.
    default: "false"
  expect-config-fingerprint:
    description: "sha256 the effective configuration must match, so a PR cannot weaken the gate."
    default: ""
  config:
    description: "Explicit config file instead of the project's own."
    default: ""
  sarif-file:
    description: "Where to write the SARIF report. Empty to skip SARIF."
    default: "code-quality-results.sarif"
  upload-sarif:
    description: >-
      Upload the SARIF to GitHub code scanning. Requires `security-events: write`
      and code scanning to be available for the repository.
    default: "false"
  extra-args:
    description: "Additional analyzer arguments, space separated."
    default: ""
  python-version:
    description: "Python used to run the analyzer."
    default: "3.12"

outputs:
  exit-code:
    description: "Analyzer exit code (0 pass, 1 below threshold, 2 nothing analyzed, 3 coverage gap, 4 findings, 5 score not applicable, 6 config mismatch)."
    value: ${{ steps.gate.outputs.exit-code }}
  verdict:
    description: "pass or fail."
    value: ${{ steps.gate.outputs.verdict }}
  score:
    description: "Architecture signal score, or empty when not applicable."
    value: ${{ steps.gate.outputs.score }}
  findings:
    description: "Number of selected findings."
    value: ${{ steps.gate.outputs.findings }}
  sarif-file:
    description: "Path of the SARIF report, when written."
    value: ${{ steps.gate.outputs.sarif-file }}
  configuration-fingerprint:
    description: "sha256 of the effective analyzer configuration."
    value: ${{ steps.gate.outputs.configuration-fingerprint }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install cqa-analyzer ${{ inputs.version }}
      shell: bash
      env:
        WANTED_VERSION: ${{ inputs.version }}
        WANTED_DEEP: ${{ inputs.deep }}
      run: |
        set -euo pipefail
        extra=""
        if [ "$WANTED_DEEP" = "true" ]; then extra="[deep]"; fi
        python -P -m pip install --quiet --disable-pip-version-check "cqa-analyzer${extra}==${WANTED_VERSION}"
        code-quality-analyzer --version

    - name: Changed-lines manifest
      id: changed
      shell: bash
      env:
        MODE: ${{ inputs.changed-lines }}
        INCLUDE_DELETIONS: ${{ inputs.include-deletions }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ACTION_PATH: ${{ github.action_path }}
        PROJECT: ${{ inputs.path }}
      run: |
        set -euo pipefail
        manifest=""
        case "$INCLUDE_DELETIONS" in
          true) deletions=(--include-deletions) ;;
          false|"") deletions=() ;;
          *) echo "::error::include-deletions must be true or false"; exit 1 ;;
        esac
        case "$MODE" in
          false|"") ;;
          auto)
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
              manifest="$RUNNER_TEMP/changed-lines.json"
              bash "$ACTION_PATH/scripts/pr_changed_lines.sh" \
                "$BASE_SHA" "$HEAD_SHA" "$PROJECT" "$manifest" ${deletions[@]+"${deletions[@]}"}
              echo "changed-lines: $(python -P -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["files"]))' "$manifest") files"
            else
              echo "changed-lines: not a pull_request event; gating the whole project"
            fi ;;
          *) manifest="$MODE" ;;
        esac
        case "$manifest" in
          *$'\n'*|*$'\r'*) echo "::error::changed-lines path must not contain a line break"; exit 1 ;;
        esac
        echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

    - name: Run the gate
      id: gate
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        STRICT: ${{ inputs.strict }}
        BASELINE: ${{ inputs.baseline }}
        NEW_ONLY: ${{ inputs.new-findings-only }}
        MANIFEST: ${{ steps.changed.outputs.manifest }}
        FINGERPRINT: ${{ inputs.expect-config-fingerprint }}
        CONFIG: ${{ inputs.config }}
        SARIF: ${{ inputs.sarif-file }}
        EXTRA: ${{ inputs.extra-args }}
      run: |
        # The runner forces `bash -e -o pipefail` on composite steps, so a
        # non-zero analyzer exit must be captured explicitly or the step dies
        # before results are recorded. The verdict is enforced in a later step.
        set -u
        args=("$PROJECT" --offline)
        if [ -n "$FAIL_ON" ]; then args+=(--fail-on "$FAIL_ON"); fi
        if [ -n "$FAIL_UNDER" ]; then args+=(--fail-under "$FAIL_UNDER"); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$BASELINE" ]; then
          args+=(--baseline "$BASELINE")
          if [ "$NEW_ONLY" = "true" ]; then args+=(--new-findings-only); fi
        fi
        if [ -n "$MANIFEST" ]; then args+=(--changed-lines-manifest "$MANIFEST"); fi
        if [ -n "$FINGERPRINT" ]; then args+=(--expect-config-fingerprint "$FINGERPRINT"); fi
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        # shellcheck disable=SC2206 # intentional word splitting of extra args
        if [ -n "$EXTRA" ]; then args+=($EXTRA); fi

        report="$RUNNER_TEMP/code-quality-report.json"
        code=0
        code-quality-analyzer "${args[@]}" --output-format json > "$report" || code=$?
        if [ -n "$SARIF" ]; then
          code-quality-analyzer "${args[@]}" --output-format sarif > "$SARIF" || true
        fi

        # Outputs and CQA_* env for the success path; $RUNNER_TEMP/cqa-results.json
        # for every path (the runner drops a failed composite action's outputs
        # and env writes, and the failing path is the one callers inspect).
        # The report describes untrusted code, so every value is type-checked
        # and written with a random heredoc delimiter: a line break in any
        # value cannot start a new output or environment variable.
        python -P - "$report" "$code" "$SARIF" <<'PY'
        import json, os, re, secrets, sys
        path, code, sarif = sys.argv[1], int(sys.argv[2]), sys.argv[3]
        try:
            r = json.load(open(path))
        except Exception:
            r = {}
        if not isinstance(r, dict):
            r = {}
        score = r.get("architecture_signal_score")
        if isinstance(score, bool) or not isinstance(score, (int, float)):
            score = ""
        findings = r.get("findings")
        fingerprint = r.get("configuration_fingerprint")
        if not (isinstance(fingerprint, str) and re.fullmatch(r"[0-9a-f]{64}", fingerprint)):
            fingerprint = ""
        values = {
            "exit-code": code,
            "verdict": "pass" if code == 0 else "fail",
            "score": score,
            "findings": len(findings) if isinstance(findings, list) else 0,
            "configuration-fingerprint": fingerprint,
            "sarif-file": sarif,
        }

        def entry(name, value):
            value = str(value)
            delimiter = f"ghadelimiter_{secrets.token_hex(16)}"
            while delimiter in value:
                delimiter = f"ghadelimiter_{secrets.token_hex(16)}"
            return f"{name}<<{delimiter}\n{value}\n{delimiter}\n"

        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.writelines(entry(k, v) for k, v in values.items())
        with open(os.environ["GITHUB_ENV"], "a") as env:
            env.writelines(entry(f"CQA_{k.upper().replace('-', '_')}", v) for k, v in values.items())
        # The runner drops a failed composite action's outputs *and* env writes.
        # This file survives: later steps can read it with `if: always()`.
        with open(os.path.join(os.environ["RUNNER_TEMP"], "cqa-results.json"), "w") as fh:
            json.dump({k.replace("-", "_"): v for k, v in values.items()}, fh)
        PY

        # Paths, messages and rule ids come from the PR, so every value is
        # rendered as inert text: control characters become spaces, ASCII
        # punctuation becomes a numeric entity (no HTML, links, mentions,
        # table breaks or code-span escapes), and each cell is length-bounded.
        python -P - "$report" "$code" "$MANIFEST" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, re, string, sys
        path, code, manifest = sys.argv[1], int(sys.argv[2]), sys.argv[3]
        reasons = {0: "pass", 1: "score below --fail-under", 2: "nothing analyzed",
                   3: "coverage gap", 4: "findings at or above --fail-on",
                   5: "score not applicable", 6: "configuration fingerprint mismatch"}
        punct = {ord(c): f"&#{ord(c)};" for c in string.punctuation}

        def text(value, limit=300):
            value = re.sub(r"[\x00-\x1f\x7f-\x9f\u2028\u2029]", " ", str(value))
            if len(value) > limit:
                value = value[:limit] + "…"
            return value.translate(punct)

        try:
            r = json.load(open(path))
        except Exception:
            r = {}
        if not isinstance(r, dict):
            r = {}
        findings = r.get("findings")
        findings = [f for f in findings if isinstance(f, dict)] if isinstance(findings, list) else []
        print(f"## Code quality gate: {'✅ pass' if code == 0 else '❌ fail'} — {text(reasons.get(code, code))}")
        print()
        print(f"- analyzer {text(r.get('analyzer_version','?'))} · ruleset {text(r.get('ruleset_version','?'))} · "
              f"scoring policy {text(r.get('scoring_policy_version','?'))}")
        print(f"- architecture signal score: {text(r.get('architecture_signal_score','n/a'))}")
        print(f"- selected findings: {len(findings)}" + (" (changed lines only)" if manifest else ""))
        fp = r.get("configuration_fingerprint")
        if isinstance(fp, str) and re.fullmatch(r"[0-9a-f]{64}", fp):
            print(f"- configuration fingerprint: `{fp}`")
        if findings:
            print()
            print("| rule | severity | location | message |")
            print("|---|---|---|---|")
            for f in findings[:50]:
                loc = f.get("location")
                loc = loc if isinstance(loc, dict) else {}
                print(f"| <code>{text(f.get('rule_id'), 120)}</code> | {text(f.get('severity'), 20)} | "
                      f"<code>{text(loc.get('path'), 200)}:{text(loc.get('line'), 12)}</code> | "
                      f"{text(f.get('message'))} |")
            if len(findings) > 50:
                print(f"| … | | | {len(findings) - 50} more |")
        PY

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && inputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: cqa-analyzer

    - name: Enforce the verdict
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "::error::code-quality-analyzer gate failed with exit code $CODE (see the job summary)"
          exit "$CODE"
        fi
